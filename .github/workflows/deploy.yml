# Publica el microsite en GitHub Pages en cada push a main.
#
# No hace falta configurar `base` ni reglas de rewrite: el proyecto usa rutas
# relativas (`base: './'`) y HashRouter, así que funciona igual en la raíz del
# dominio que bajo el subpath /<repo>/ que asigna Pages.

name: Publicar microsite

# Cada push a main publica. El disparo estuvo comentado un tiempo «mientras se
# calibran las pantallas mobile contra el Figma», y esa razón ya no aplica: las
# diez composiciones mobile están medidas contra el spec con `npm run
# figma:check`, así que la calibración ya no depende de mirar el sitio publicado.
#
# `workflow_dispatch` se queda igual, para poder republicar a mano sin tener que
# inventar un commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; si se encolan varios, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

# Las cinco acciones van en la primera versión que corre sobre Node 24: el
# runner deja de avisar por el node20 en camino de baja. `node-version: 20` de
# más abajo es otra cosa —el Node con el que se compila el proyecto— y no se
# toca acá.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Falla el build si hay errores de tipos, antes de publicar nada.
      #
      # LAS VARIABLES VAN ACÁ O NO VAN. Vite las resuelve en tiempo de
      # COMPILACIÓN: `import.meta.env.VITE_API_URL` se reemplaza por el literal
      # dentro del JavaScript publicado. Si el paso de build no las recibe, el
      # sitio se publica con la cadena vacía y `promoApi.ts` elige el mock —o
      # sea que la promo saldría al aire sin backend, sin fallar y sin avisar—.
      #
      # Se leen de `vars`, no de `secrets`, y a propósito: quedan incrustadas en
      # el bundle, así que sólo pueden contener valores PÚBLICOS. La URL del
      # backend y la clave de sitio de reCAPTCHA lo son. Nunca poner acá la
      # clave secreta de reCAPTCHA ni credenciales de Avimovil.
      #
      # Hay que cargarlas antes en Settings → Secrets and variables → Actions →
      # Variables:
      #   VITE_API_URL=https://promo.edge.com.py/purosol
      #   VITE_RECAPTCHA_SITE_KEY=6LfcYIQtAAAAAAqpWHzZ6y-cTCPOPEBXIu8XJWOD
      #
      # Si las variables no existen, `vars.X` se resuelve como cadena vacía y el
      # sitio vuelve al mock: el mismo comportamiento que hoy, sin romperse.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
