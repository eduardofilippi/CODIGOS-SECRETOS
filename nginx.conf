server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Comprimir lo que pesa y comprime bien.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets de Vite: el nombre lleva hash de contenido → cache inmutable larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HashRouter: el servidor sólo entrega index.html; las rutas viven tras el #.
    # El fallback cubre cualquier path que no sea un archivo real (index.html
    # nunca se cachea de más porque referencia los assets ya hasheados).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
